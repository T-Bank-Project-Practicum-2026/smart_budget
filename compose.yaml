x-postgres-env: &postgres-env
  PGHOST: postgres
  PGPORT: '5432'
  PGDATABASE: smart_budget
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  PGSSLMODE: disable
  PGCONNECT_TIMEOUT: '5'

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:${POSTGRES_VOLUME_TARGET:-/var/lib/postgresql}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smart_budget']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      args:
        APP_PATH: ./cmd/migrate
    profiles: ['tools']
    environment:
      <<: *postgres-env
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Run make init}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Run make init}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Run make init}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['up']
    healthcheck:
      disable: true

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - '1'
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - kafka:9092
      - --set
      - redpanda.auto_create_topics_enabled=false
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info', '-X', 'brokers=127.0.0.1:9092']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    profiles: ['tools']
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['rpk']
    command: ['topic', 'create', 'notifications.requested.v1', '--if-not-exists', '--partitions', '3', '--replicas', '1', '-X', 'brokers=kafka:9092']

  worker:
    build:
      context: ./backend
      args:
        APP_PATH: ./cmd/worker
    restart: unless-stopped
    environment:
      <<: *postgres-env
      PGUSER: budget_worker
      PGPASSWORD: ${WORKER_DB_PASSWORD:?Run make init}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *postgres-env
      PGUSER: budget_api
      PGPASSWORD: ${API_DB_PASSWORD:?Run make init}
      HTTP_ADDR: ':8080'
      NOTIFICATIONS_URL: http://notifications:8080
      NOTIFICATIONS_TOKEN: ${NOTIFICATIONS_TOKEN:?Run make init}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Run make init}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3000,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?Run make init}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  notifications:
    build:
      context: ./backend
      args:
        APP_PATH: ./cmd/notifications
    restart: unless-stopped
    environment:
      <<: *postgres-env
      PGUSER: budget_notifications
      PGPASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Run make init}
      HTTP_ADDR: ':8080'
      NOTIFICATIONS_TOKEN: ${NOTIFICATIONS_TOKEN:?Run make init}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Run make init}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Run make init}
      AUTH_API_URL: http://backend:8080
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '0.0.0.0:${FRONTEND_PORT:-3000}:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  lint-go:
    build:
      context: ./backend
      dockerfile: lint.Dockerfile
    profiles: ['tools']
    working_dir: /app
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
      - go_lint:/root/.cache/golangci-lint
    entrypoint: ['golangci-lint']

  test-go:
    environment:
      <<: *postgres-env
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    image: golang:1.27-alpine
    profiles: ['tools']
    working_dir: /app
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    command: ['go', 'test', '-count=1', './...']

  lint-frontend:
    image: node:26-alpine
    profiles: ['tools']
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    entrypoint: ['sh', '-c']
    command: ['npm ci && npm run lint']

volumes:
  postgres_data:
  redpanda_data:
  go_modules:
  go_build:
  go_lint:
  frontend_node_modules:
