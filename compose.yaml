x-postgres-env: &postgres-env
  PGHOST: postgres
  PGPORT: '5432'
  PGDATABASE: smart_budget
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  PGSSLMODE: disable
  PGCONNECT_TIMEOUT: '5'

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smart_budget']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      args:
        APP_PATH: ./cmd/migrate
    profiles: ['tools']
    environment: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ['up']
    healthcheck:
      disable: true

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'kafka:9092', '--list']
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      HTTP_ADDR: ':8080'
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  notifications:
    build:
      context: ./backend
      args:
        APP_PATH: ./cmd/notifications
    restart: unless-stopped
    environment:
      HTTP_ADDR: ':8080'
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  lint-go:
    build:
      context: ./backend
      dockerfile: lint.Dockerfile
    profiles: ['tools']
    working_dir: /app
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
      - go_lint:/root/.cache/golangci-lint
    entrypoint: ['golangci-lint']

  test-go:
    environment:
      <<: *postgres-env
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    image: golang:1.27-alpine
    profiles: ['tools']
    working_dir: /app
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    command: ['go', 'test', './...']

  lint-frontend:
    image: node:26-alpine
    profiles: ['tools']
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    entrypoint: ['sh', '-c']
    command: ['npm ci && npm run lint']

volumes:
  postgres_data:
  kafka_data:
  go_modules:
  go_build:
  go_lint:
  frontend_node_modules:
