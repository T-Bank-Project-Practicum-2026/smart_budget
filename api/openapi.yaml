# Сгенерировано командой. Не редактируйте вручную.
components:
  schemas:
    auth.LoginInput:
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 72
          minLength: 8
          type: string
      required:
      - email
      - password
      type: object
    auth.RegisterInput:
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 72
          minLength: 8
          type: string
        timezone:
          default: UTC
          example: Asia/Novosibirsk
          type: string
      required:
      - email
      - password
      type: object
    auth.User:
      properties:
        createdAt:
          format: date-time
          type: string
        email:
          format: email
          type: string
        id:
          type: string
        timezone:
          type: string
      required:
      - createdAt
      - email
      - id
      - timezone
      type: object
    push.Event:
      properties:
        body:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        title:
          type: string
        userId:
          type: string
      required:
      - body
      - createdAt
      - id
      - title
      - userId
      type: object
    runtime.HealthResponse:
      properties:
        service:
          example: smart_budget
          type: string
        status:
          example: ok
          type: string
      required:
      - service
      - status
      type: object
    server.ErrorResponse:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    server.PublicKeyResponse:
      properties:
        publicKey:
          type: string
      required:
      - publicKey
      type: object
    server.QueuedResponse:
      properties:
        id:
          type: string
        status:
          enum:
          - queued
          type: string
      required:
      - id
      - status
      type: object
    server.SubscriptionInput:
      properties:
        endpoint:
          format: uri
          maxLength: 4096
          type: string
        keys:
          properties:
            auth:
              type: string
            p256dh:
              type: string
          required:
          - auth
          - p256dh
          type: object
      required:
      - endpoint
      - keys
      type: object
    server.UnsubscribeInput:
      properties:
        endpoint:
          format: uri
          type: string
      required:
      - endpoint
      type: object
  securitySchemes:
    accessCookie:
      in: cookie
      name: budget_access
      type: apiKey
    refreshCookie:
      in: cookie
      name: budget_refresh
      type: apiKey
externalDocs:
  description: Спецификация OpenAPI 3.1
  url: https://spec.openapis.org/oas/v3.1.0
info:
  description: 'Авторизация через HttpOnly-cookie. Для POST, PUT и DELETE нужны разрешённый
    Origin и X-CSRF-Protection: 1.'
  title: API «Умный бюджет»
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/health:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtime.HealthResponse'
          description: Сервис работает
      summary: Проверка API
      tags:
      - Состояние сервиса
  /api/ready:
    get:
      responses:
        "204":
          description: Выполнено, без тела ответа
        "503":
          description: PostgreSQL недоступен
      summary: Готовность API
      tags:
      - Состояние сервиса
  /api/v1/auth/login:
    post:
      parameters:
      - description: Защита от CSRF
        in: header
        name: X-CSRF-Protection
        required: true
        schema:
          enum:
          - "1"
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.LoginInput'
              description: Данные пользователя
              summary: body
        description: Данные пользователя
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.User'
          description: Профиль пользователя
          headers:
            Set-Cookie:
              description: Cookie budget_access и budget_refresh с флагом HttpOnly
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Ошибка запроса
      summary: Вход
      tags:
      - Авторизация
  /api/v1/auth/logout:
    post:
      description: Завершает сессию по любой из двух cookie и удаляет обе. Без cookie
        тоже возвращает 204.
      parameters:
      - description: Защита от CSRF
        in: header
        name: X-CSRF-Protection
        required: true
        schema:
          enum:
          - "1"
          type: string
      - description: ID пользователя. Если не совпадает с сессией — ошибка 409
        in: header
        name: X-Account-ID
        schema:
          type: string
      responses:
        "204":
          description: Выполнено, без тела ответа
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Ошибка запроса
      summary: Выход
      tags:
      - Авторизация
  /api/v1/auth/me:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.User'
          description: Профиль пользователя
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Ошибка запроса
      security:
      - accessCookie: []
      summary: Текущий пользователь
      tags:
      - Авторизация
  /api/v1/auth/refresh:
    post:
      description: Обновляет обе cookie по refresh-сессии.
      parameters:
      - description: Защита от CSRF
        in: header
        name: X-CSRF-Protection
        required: true
        schema:
          enum:
          - "1"
          type: string
      responses:
        "204":
          description: Выполнено, без тела ответа
          headers:
            Set-Cookie:
              description: Cookie budget_access и budget_refresh с флагом HttpOnly
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Ошибка запроса
      security:
      - refreshCookie: []
      summary: Обновление сессии
      tags:
      - Авторизация
  /api/v1/auth/register:
    post:
      parameters:
      - description: Защита от CSRF
        in: header
        name: X-CSRF-Protection
        required: true
        schema:
          enum:
          - "1"
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.RegisterInput'
              description: Данные пользователя
              summary: body
        description: Данные пользователя
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.User'
          description: Пользователь зарегистрирован
          headers:
            Set-Cookie:
              description: Cookie budget_access и budget_refresh с флагом HttpOnly
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Ошибка запроса
      summary: Регистрация
      tags:
      - Авторизация
  /api/v1/notifications:
    get:
      description: Сначала новые.
      parameters:
      - description: ID пользователя. Если не совпадает с сессией — ошибка 409
        in: header
        name: X-Account-ID
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/push.Event'
                type: array
          description: Список уведомлений
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Ошибка запроса
      security:
      - accessCookie: []
      summary: Последние 20 уведомлений
      tags:
      - Уведомления
  /api/v1/notifications/test:
    post:
      description: Добавляет уведомление в очередь, не чаще раза в 10 секунд. Повторный
        запрос с тем же Idempotency-Key возвращает тот же ID.
      parameters:
      - description: Защита от CSRF
        in: header
        name: X-CSRF-Protection
        required: true
        schema:
          enum:
          - "1"
          type: string
      - description: ID пользователя. Если не совпадает с сессией — ошибка 409
        in: header
        name: X-Account-ID
        schema:
          type: string
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 100
          minLength: 16
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.QueuedResponse'
          description: Уведомление в очереди
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Ошибка запроса
      security:
      - accessCookie: []
      summary: Тестовое уведомление
      tags:
      - Уведомления
  /api/v1/push/key:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.PublicKeyResponse'
          description: Публичный ключ
      summary: Публичный VAPID-ключ
      tags:
      - Push-уведомления
  /api/v1/push/subscription:
    delete:
      parameters:
      - description: Защита от CSRF
        in: header
        name: X-CSRF-Protection
        required: true
        schema:
          enum:
          - "1"
          type: string
      - description: ID пользователя. Если не совпадает с сессией — ошибка 409
        in: header
        name: X-Account-ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.UnsubscribeInput'
              description: Push-подписка
              summary: body
        description: Push-подписка
        required: true
      responses:
        "204":
          description: Выполнено, без тела ответа
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Ошибка запроса
      security:
      - accessCookie: []
      summary: Отписка от push
      tags:
      - Push-уведомления
    put:
      parameters:
      - description: Защита от CSRF
        in: header
        name: X-CSRF-Protection
        required: true
        schema:
          enum:
          - "1"
          type: string
      - description: ID пользователя. Если не совпадает с сессией — ошибка 409
        in: header
        name: X-Account-ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.SubscriptionInput'
              description: Push-подписка
              summary: body
        description: Push-подписка
        required: true
      responses:
        "204":
          description: Выполнено, без тела ответа
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.ErrorResponse'
          description: Ошибка запроса
      security:
      - accessCookie: []
      summary: Подписка на push
      tags:
      - Push-уведомления
servers:
- url: /
