syntax = "proto3";

package smartbudget.services.v1;

import "google/protobuf/timestamp.proto";

option go_package = "smart_budget/internal/gen/smartbudget/services/v1;servicesv1";

// Проверка сессии у владельца данных авторизации.
service AuthService {
  rpc CheckSession(CheckSessionRequest) returns (CheckSessionResponse);
}

message CheckSessionRequest {
  string user_id = 1;
  string session_id = 2;
}

message CheckSessionResponse {
  bool active = 1;
}

// Управление подписками принадлежит notifications.
service SubscriptionsService {
  rpc UpsertSubscription(UpsertSubscriptionRequest) returns (UpsertSubscriptionResponse);
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);
}

message UpsertSubscriptionRequest {
  string user_id = 1;
  string session_id = 2;
  google.protobuf.Timestamp session_expires_at = 3;
  string endpoint = 4;
  string p256dh = 5;
  string auth = 6;
}

message UpsertSubscriptionResponse {}

message DeleteSubscriptionRequest {
  string user_id = 1;
  string endpoint = 2;
}

message DeleteSubscriptionResponse {}

// Значение Kafka-записи notifications.requested.v2; ключ — user_id.
message NotificationRequested {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
}
